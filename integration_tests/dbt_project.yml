name: 'dbt_tags_test'
version: '0.0.0'
config-version: 2

profile: 'dbt_tags'
flags:
  send_anonymous_usage_stats: False
  use_colors: True

clean-targets:
  - "target"
  - "dbt_packages"
  - "logs"

on-run-start:
  - > # create quoted source table
    {% if var("fresh", "0") | lower in ["true", "yes", "1"] %}
      create or replace table {{ generate_schema_name("raw") }}."rawDummy" (name varchar)
      as select 'test_quoting' as name;
    {% endif %}
  - > # create tags outside of the dbt_tags namespace, core.semantic_category mimics snowflake.core.semantic_category
    {% if var("fresh", "0") | lower in ["true", "yes", "1"] %}
      {% for external_tag in ["governance.pii_external", "core.semantic_category"] %}
        create schema if not exists {{ dbt_tags.get_tag_fqn(external_tag).rsplit(".", 1)[0] }};
        create tag if not exists {{ dbt_tags.get_tag_fqn(external_tag) }};
      {% endfor %}
    {% endif %}
on-run-end:
  - >
    {% if flags.WHICH in ('run', 'build') %}
      {{ dbt_tags.apply_source_column_tags() }}
    {% endif %}

quoting:
  database: false
  schema: false
  identifier: false

vars:
  dbt_tags__tag_source_columns: true
  dbt_tags__database: dbt_tags
  dbt_tags__schema: common
  dbt_tags__resource_types: ["model", "snapshot", "source"]
  dbt_tags__allowed_tags:
    - pii_name
    - pii_amount
    - pii_null
    - abc
    - governance.pii_external
    - dbt_tags.core.semantic_category
  dbt_tags__policy_data_types:
    - pii_null: ['varchar','number']

models:
  dbt_tags_test:
    +post-hook:
      - >
        {% if flags.WHICH in ('run', 'build') %}
          {{ dbt_tags.apply_column_tags() }}
        {% endif %}

seeds:
  dbt_tags_test:
    +schema: raw
