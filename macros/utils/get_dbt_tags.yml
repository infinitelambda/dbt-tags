macros:
  - name: get_dbt_tags
    description: |
      Loops through `graph` variable to find all (allowed) dbt column tags. Model-level tags are left out: they are dbt selectors, never Snowflake tags.
      Note: Allowed dbt tags are controlled by the `dbt_tags__allowed_tags` variable, [] by default which means all allowed

      **Usage**:
      ```sql
      {% raw %}
      {% set tags = dbt_tags.get_dbt_tags() %}
      {% endraw %}
      ```

      **Output**: `tags` will result as list of dict, 1 item will represent for 1 dbt tag as below:
      ```json
      {
        "name": <column name>,
        "tag": <dbt tag name>,
        "model_fqn": <model name>,
        "quote": <column quote config>
      }
      ```
    arguments:
      - name: with_value
        type: bool
        description: Enable to `true` for including column values in the output
